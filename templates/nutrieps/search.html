{% extends "base.html" %}
{% load static %}

{% block title %}Search food - NUTRIEPS{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css"/>
<script src="https://code.jquery.com/jquery-3.6.0.js"></script>
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>

<div class="dashboard-container">
    <div class="dash-greeting" style="text-align: center; margin-bottom: 2rem;">
        <h2>Food Search</h2>
        <p>Find and add items to your daily log.</p>
    </div>

    <div class="summary-card" style="max-width: 600px; margin: 0 auto 3rem auto; padding: 2rem;">
        <div style="display: flex; gap: 10px;">
            <input type="text" id="searchInput" placeholder="Type a food name (e.g., Apple)..." required
                   style="flex: 1; padding: 0.8rem 1rem; border: 1px solid var(--color-border); border-radius: 8px; font-size: 1rem; outline: none;">
            <button type="button" id="searchBtn" class="profile-btn" style="border-radius: 8px;">Search</button>
        </div>
    </div>

    {% if error_message %}
    <div class="error-message" style="max-width: 600px; margin: 0 auto 2rem auto;">
        {{ error_message }}
    </div>
    {% endif %}

    {% csrf_token %}
    <div id="resultsContainer" class="quick-links-grid"></div>

</div>

<script>
    window.ADD_CONSUMPTION_URL = "{% url 'nutrieps:add_consumption' %}";
</script>

<script src="{% static 'nutrieps/js/autocomplete.js' %}"></script>

{% endblock %}
